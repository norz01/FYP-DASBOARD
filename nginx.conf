server {
    listen 80;
    server_name localhost;

    # TAMBAHAN: Benarkan muat naik fail besar (seperti .mdb) sehingga 100MB
    client_max_body_size 100M;

    # Root folder untuk fail React build
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy untuk API backend
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # TAMBAHAN: Pastikan proxy turut benarkan saiz fail besar
        client_max_body_size 100M;
    }

    # TAMBAHAN BAHARU: Proxy untuk fail yang dimuat naik (gambar/PDF sijil)
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}